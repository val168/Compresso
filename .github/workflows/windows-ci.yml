name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.preset }} build and tests
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install MinGW-w64 UCRT64 and Qt 6
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base

      - name: Configure ${{ matrix.preset }}
        shell: msys2 {0}
        run: cmake --preset ${{ matrix.preset }} "-DCMAKE_PREFIX_PATH=$(cygpath -m /ucrt64)"

      - name: Build ${{ matrix.preset }}
        shell: msys2 {0}
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run ${{ matrix.preset }} tests
        shell: msys2 {0}
        run: ctest --test-dir out/build/${{ matrix.preset }} --output-on-failure

      - name: Package portable Release
        if: matrix.preset == 'release'
        shell: msys2 {0}
        run: cmake --build --preset release --target package-portable

      - name: Smoke-test portable ZIP without Qt or MSYS2 on PATH
        if: matrix.preset == 'release'
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP ("Compresso-portable-" + [guid]::NewGuid())
          Expand-Archive -LiteralPath (Get-ChildItem 'out/build/release/portable/*.zip' | Select-Object -First 1).FullName -DestinationPath $testRoot
          $application = Join-Path $testRoot 'Compresso/bin/Compresso.exe'
          if (-not (Test-Path -LiteralPath $application -PathType Leaf)) {
            throw 'Compresso.exe was not present in the portable ZIP.'
          }
          $env:PATH = "$env:WINDIR\System32;$env:WINDIR"
          $process = Start-Process -FilePath $application -PassThru
          try {
            if (-not $process.WaitForInputIdle(15000) -or $process.HasExited) {
              throw 'Packaged Compresso did not reach its GUI message loop.'
            }
            $windowReady = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              $process.Refresh()
              if ($process.HasExited) {
                throw "Packaged Compresso exited during startup with code $($process.ExitCode)."
              }
              if ($process.MainWindowHandle -ne 0) {
                $windowReady = $true
                break
              }
              Start-Sleep -Milliseconds 100
            }
            if (-not $windowReady) {
              throw 'Packaged Compresso did not create its main window.'
            }
            Start-Sleep -Seconds 1
            if (-not $process.CloseMainWindow() -or -not $process.WaitForExit(5000)) {
              throw 'Packaged Compresso did not close cleanly after the smoke test.'
            }
            if ($process.ExitCode -ne 0) {
              throw "Packaged Compresso exited with code $($process.ExitCode)."
            }
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Upload portable Release ZIP
        if: matrix.preset == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: Compresso-portable-windows-x64
          path: out/build/release/portable/*.zip
          if-no-files-found: error
          retention-days: 30
