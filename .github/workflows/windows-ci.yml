name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.preset }} build and tests
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install MinGW-w64 UCRT64 and Qt 6
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base

      - name: Prepare disposable NTFS compression test directory
        shell: pwsh
        run: |
          $testTemp = Join-Path $env:LOCALAPPDATA ("Temp\Compresso-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT + "-${{ matrix.preset }}")
          New-Item -ItemType Directory -Path $testTemp -Force | Out-Null
          "COMPRESSO_TEST_TEMP=$testTemp" >> $env:GITHUB_ENV
          
      - name: Configure ${{ matrix.preset }}
        shell: msys2 {0}
        run: cmake --preset ${{ matrix.preset }} "-DCMAKE_PREFIX_PATH=$(cygpath -m /ucrt64)"

      - name: Build ${{ matrix.preset }}
        shell: msys2 {0}
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run ${{ matrix.preset }} tests
        shell: msys2 {0}
        run: |
          test_temp="$(cygpath -u "$COMPRESSO_TEST_TEMP")"
          mkdir -p "$test_temp"
          windows_test_temp="$(cygpath -w "$test_temp")"
          if TEMP="$windows_test_temp" TMP="$windows_test_temp" TMPDIR="$test_temp" ctest --test-dir out/build/${{ matrix.preset }} --output-on-failure; then
            test_status=0
          else
            test_status=$?
          fi
          test_log="out/build/${{ matrix.preset }}/CompressoUiTests.txt"
          if [ -f "$test_log" ]; then
            cat "$test_log"
          else
            echo "QtTest did not create its result log: $test_log"
          fi
          exit "$test_status"

      - name: Package portable Release
        if: matrix.preset == 'release'
        shell: msys2 {0}
        run: cmake --build --preset release --target package-portable

      - name: Smoke-test portable ZIP without Qt or MSYS2 on PATH
        if: matrix.preset == 'release'
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP ("Compresso-portable-" + [guid]::NewGuid())
          Expand-Archive -LiteralPath (Get-ChildItem 'out/build/release/portable/*.zip' | Select-Object -First 1).FullName -DestinationPath $testRoot
          $application = Join-Path $testRoot 'Compresso/bin/Compresso.exe'
          if (-not (Test-Path -LiteralPath $application -PathType Leaf)) {
            throw 'Compresso.exe was not present in the portable ZIP.'
          }
          $env:PATH = "$env:WINDIR\System32;$env:WINDIR"
          $process = Start-Process -FilePath $application -PassThru
          try {
            if (-not $process.WaitForInputIdle(15000) -or $process.HasExited) {
              throw 'Packaged Compresso did not reach its GUI message loop.'
            }
            $windowReady = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              $process.Refresh()
              if ($process.HasExited) {
                throw "Packaged Compresso exited during startup with code $($process.ExitCode)."
              }
              if ($process.MainWindowHandle -ne 0) {
                $windowReady = $true
                break
              }
              Start-Sleep -Milliseconds 100
            }
            if (-not $windowReady) {
              throw 'Packaged Compresso did not create its main window.'
            }
            Start-Sleep -Seconds 1
            if (-not $process.CloseMainWindow() -or -not $process.WaitForExit(5000)) {
              throw 'Packaged Compresso did not close cleanly after the smoke test.'
            }
            if ($process.ExitCode -ne 0) {
              throw "Packaged Compresso exited with code $($process.ExitCode)."
            }
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Upload portable Release ZIP
        if: matrix.preset == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: Compresso-portable-windows-x64
          path: out/build/release/portable/*.zip
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish verified versioned Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download the tested portable ZIP
        uses: actions/download-artifact@v4
        with:
          name: Compresso-portable-windows-x64
          path: release-asset

      - name: Publish GitHub Release and attach portable ZIP
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const tag = context.ref.replace('refs/tags/', '');
            const version = tag.replace(/^v/, '');
            const assetPath = path.join('release-asset', `Compresso-${version}-windows-x64.zip`);
            const notes = [
              `Compresso ${version} is a Windows utility for analyzing game folders and applying transparent NTFS LZX compression in place.`,
              '',
              '- Analyze logical and allocated sizes, file counts, filesystem type, and LZX eligibility.',
              '- Compress and restore files through Windows `compact.exe /C /EXE:LZX` and `/U /EXE:LZX`; file paths and direct game access are preserved.',
              '- Run scans and file operations asynchronously with progress, cancellation, per-file results, and diagnostic details.',
              '- Includes a fixed-size dark interface with a custom cup icon and a portable Windows distribution.',
              '',
              'Requires 64-bit Windows 10 or later. Compression requires a local fixed NTFS volume that supports file compression. File compatibility and space savings vary; review skipped and failed files and test the game after compression.'
            ].join('\n');

            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: context.sha,
                name: `Compresso ${version}`, body: notes, draft: true,
                prerelease: false
              })).data;
            }

            const existingAsset = release.assets.find(asset => asset.name === path.basename(assetPath));
            if (existingAsset && release.draft) {
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: existingAsset.id });
            }
            if (!existingAsset || release.draft) {
              const stats = fs.statSync(assetPath);
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name: path.basename(assetPath),
                data: fs.readFileSync(assetPath),
                headers: { 'content-type': 'application/zip', 'content-length': stats.size }
              });
            }
            if (release.draft) {
              await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, draft: false });
            }
